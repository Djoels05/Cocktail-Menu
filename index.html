<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocktails — Receptkaart</title>
<style>
  :root{
    --green-deep:#16241F;
    --green-mid:#1F332C;
    --parchment:#EFE7D2;
    --brass:#B8934A;
    --brass-bright:#D4AF6A;
    --burgundy:#7A2E2E;
    --ink:#1A1410;
    --line: rgba(184,147,74,0.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--green-deep);
    background-image:
      radial-gradient(circle at 20% 0%, rgba(184,147,74,0.08), transparent 40%),
      radial-gradient(circle at 80% 100%, rgba(122,46,46,0.10), transparent 45%);
    color:var(--parchment);
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  @media (max-width:640px){
    body{padding-top:88px;}
  }
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  .wrap{max-width:1000px; margin:0 auto; position:relative;}

  /* ---------- Hamburger + drawer ---------- */
  .menu-toggle{
    position:fixed;
    top:20px; left:20px;
    z-index:60;
    width:44px; height:44px;
    border-radius:4px;
    background:var(--green-mid);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .menu-toggle:hover{border-color:var(--brass-bright);}
  .menu-toggle svg{width:20px; height:20px;}
  .menu-toggle .bar{stroke:var(--parchment); stroke-width:2; stroke-linecap:round; transition:transform 0.2s, opacity 0.2s;}
  .menu-toggle.open .bar1{transform:translateY(6px) rotate(45deg);}
  .menu-toggle.open .bar2{opacity:0;}
  .menu-toggle.open .bar3{transform:translateY(-6px) rotate(-45deg);}

  .drawer-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.5);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s;
    z-index:50;
  }
  .drawer-overlay.open{opacity:1; pointer-events:auto;}

  .drawer{
    position:fixed;
    top:0; left:0; bottom:0;
    width:min(280px, 78vw);
    background:var(--green-mid);
    border-right:1px solid var(--line);
    z-index:55;
    transform:translateX(-100%);
    transition:transform 0.25s ease;
    padding:80px 0 20px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:1.1rem;
    padding:0 22px 20px;
    color:var(--brass-bright);
    letter-spacing:0.5px;
  }
  .drawer-link{
    text-align:left;
    background:transparent;
    border:none;
    border-left:3px solid transparent;
    color:var(--parchment);
    font-family:inherit;
    font-size:0.95rem;
    letter-spacing:0.5px;
    padding:14px 22px;
    cursor:pointer;
  }
  .drawer-link:hover{background:rgba(184,147,74,0.08);}
  .drawer-link.active{
    border-left-color:var(--brass-bright);
    background:rgba(184,147,74,0.12);
    color:var(--brass-bright);
    font-weight:600;
  }

  /* ---------- Views ---------- */
  .view{display:none;}
  .view.active{display:block;}

  header{
    text-align:center;
    margin-bottom:36px;
    border-bottom:1px solid var(--line);
    padding-bottom:24px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(2.2rem, 5vw, 3.4rem);
    letter-spacing:0.5px;
    margin:0 0 6px;
    color:var(--parchment);
  }
  header .sub{
    font-size:0.85rem;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--brass-bright);
  }
  .page-header{
    text-align:center;
    margin-bottom:32px;
    border-bottom:1px solid var(--line);
    padding-bottom:20px;
  }
  .page-header h2{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(1.7rem, 4vw, 2.4rem);
    margin:0 0 6px;
  }
  .page-header .sub{
    font-size:0.8rem;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--brass-bright);
  }

  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
  }
  .search-box{
    flex:1;
    min-width:220px;
    position:relative;
  }
  .search-box input{
    width:100%;
    padding:12px 14px 12px 38px;
    background:var(--green-mid);
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--parchment);
    font-family:inherit;
    font-size:0.95rem;
  }
  .search-box input:focus{
    outline:none;
    border-color:var(--brass-bright);
  }
  .search-box::before{
    content:"⌕";
    position:absolute;
    left:13px; top:50%; transform:translateY(-50%);
    color:var(--brass);
    font-size:1.1rem;
  }
  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:28px;
  }
  .chip{
    padding:6px 14px;
    border:1px solid var(--line);
    border-radius:20px;
    font-size:0.78rem;
    letter-spacing:0.5px;
    text-transform:uppercase;
    cursor:pointer;
    color:var(--parchment);
    background:transparent;
    font-family:inherit;
    transition:all 0.15s;
  }
  .chip.active{
    background:var(--brass);
    border-color:var(--brass);
    color:var(--green-deep);
    font-weight:600;
  }
  .chip:hover:not(.active){border-color:var(--brass-bright);}

  .filters-flavor{margin-top:-18px;}
  .filters-flavor .chip.active{
    background:var(--burgundy);
    border-color:var(--burgundy);
    color:var(--parchment);
  }
  .filters-flavor .chip:hover:not(.active){border-color:var(--burgundy);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(270px, 1fr));
    gap:18px;
  }

  .card{
    background:var(--parchment);
    color:var(--ink);
    border-radius:2px;
    position:relative;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
    display:flex;
    flex-direction:column;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0; height:4px;
    background:repeating-linear-gradient(90deg, var(--brass) 0 8px, transparent 8px 14px);
  }
  .card-img{
    width:100%;
    height:150px;
    object-fit:cover;
    display:block;
    filter:sepia(0.15);
    border-bottom:1px dashed rgba(26,20,16,0.25);
  }
  .card-body{
    padding:16px 18px 14px;
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .card-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:10px;
    margin-bottom:8px;
  }
  .card-head-text{
    flex:1;
    min-width:0;
  }
  .glass-icon{
    flex-shrink:0;
    width:36px;
    height:36px;
  }
  .glass-icon svg{display:block;}
  .card-tag{
    display:inline-block;
    font-size:0.65rem;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--burgundy);
    font-weight:600;
    margin-bottom:6px;
  }
  .card-body h3{
    font-family:'Fraunces', serif;
    font-size:1.3rem;
    margin:0;
    font-weight:700;
  }
  .card-desc{
    font-size:0.82rem;
    line-height:1.45;
    color:#4a3f30;
    margin-bottom:12px;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .specs{
    border-top:1px dashed rgba(26,20,16,0.25);
    padding-top:10px;
    margin-top:auto;
    font-size:0.78rem;
    line-height:1.7;
  }
  .specs div{display:flex; justify-content:space-between; gap:8px;}
  .specs .ing{color:var(--ink);}
  .specs .amt{color:var(--burgundy); font-weight:600; white-space:nowrap;}
  .meta-line{
    font-size:0.72rem;
    color:#6b5c46;
    margin-top:10px;
    font-style:italic;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }

  .favorite-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:0.72rem;
    letter-spacing:0.3px;
    font-weight:700;
    color:#c9a800;
    background:rgba(201,168,0,0.12);
    border:1px solid rgba(201,168,0,0.4);
    border-radius:20px;
    padding:3px 10px 3px 8px;
    margin-bottom:8px;
    font-family: ui-sans-serif, system-ui, sans-serif;
    width:fit-content;
  }
  .favorite-badge .star{
    color:#D4AF6A;
    font-size:0.9rem;
    line-height:1;
  }

  .flavor-tags{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-bottom:8px;
  }
  .flavor-badge{
    font-size:0.66rem;
    letter-spacing:0.5px;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:20px;
    background:rgba(122,46,46,0.08);
    border:1px solid rgba(122,46,46,0.25);
    color:var(--burgundy);
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-weight:600;
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--brass-bright);
    font-style:italic;
    grid-column:1/-1;
  }

  .status{
    text-align:center;
    font-size:0.75rem;
    color:var(--brass);
    margin-top:30px;
    opacity:0.7;
  }

  /* ---------- Drankkast page ---------- */
  .drankkast-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:16px;
  }
  .drankkast-card{
    background:var(--parchment);
    color:var(--ink);
    border-radius:2px;
    box-shadow:0 6px 18px rgba(0,0,0,0.3);
    padding:16px 18px;
  }
  .drankkast-card h3{
    font-family:'Fraunces', serif;
    font-size:1.1rem;
    margin:0 0 10px;
    color:var(--burgundy);
  }
  .brand-list{
    list-style:none;
    margin:0 0 12px;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .brand-list li{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:0.85rem;
    font-family: ui-sans-serif, system-ui, sans-serif;
    border-bottom:1px dashed rgba(26,20,16,0.2);
    padding-bottom:5px;
  }
  .brand-empty{
    font-size:0.78rem;
    color:#8a7a63;
    font-style:italic;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }

  /* ---------- Foto's page ---------- */
  .photo-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));
    gap:14px;
  }
  .photo-item{
    position:relative;
    border-radius:2px;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
    background:var(--green-mid);
  }
  .photo-item img{
    width:100%;
    height:170px;
    object-fit:cover;
    display:block;
  }
</style>
</head>

  </section>

</div>

const CATS = ["Alle","Brandy","Amari","Vermouth","Gin","Rum","Whiskey","Tequila","Wodka","Tiki","Bubbels","Overige","Mocktail"];
const DRANKKAST_CATS = CATS.filter(c=>c!=="Alle");

// Herkent welke spirit-categorieën in een cocktail zitten op basis van de ingrediëntnamen.
const SPIRIT_KEYWORDS = {
  Brandy: ["cognac", "brandy"],
  Amari: ["campari", "aperol"],
  Vermouth: ["vermouth"],
  Gin: ["gin"],
  Rum: ["rum"],
  Whiskey: ["whisk", "bourbon", "rye"],
  Tequila: ["tequila"],
  Wodka: ["wodka", "vodka"],
  Bubbels: ["prosecco", "champagne", "cava"],
  Overige: ["chartreuse", "maraschino", "curaçao", "curacao", "triple sec", "grand marnier", "cointreau", "koffielikeur", "kahlua", "kahlúa", "amaretto", "sambuca", "baileys","calvados"]
};

function deriveCategories(c){
  const cats = new Set();
  if(c.category) cats.add(c.category);
  (c.specs||[]).forEach(s=>{
    const ing = (s.i||'').toLowerCase();
    Object.entries(SPIRIT_KEYWORDS).forEach(([cat, keywords])=>{
      if(keywords.some(k=>ing.includes(k))) cats.add(cat);
    });
  });
  return Array.from(cats);
}

// Herkent de glasvorm op basis van het meta-veld (bv. "Coupeglas", "Tumbler, sinaasappelschil").
function deriveGlass(meta){
  const m = (meta||'').toLowerCase();
  if(m.includes('martini')) return 'martini';
  if(m.includes('coupe')) return 'coupe';
  if(m.includes('wijnglas')) return 'wine';
  if(m.includes('koperen beker') || m.includes('mule')) return 'mug';
  if(m.includes('zoutrand')) return 'margarita';
  if(m.includes('longdrink') || m.includes('highball')) return 'highball';
  if(m.includes('tumbler') || m.includes('rocks')) return 'rocks';
  return 'rocks';
}

// Bouwt een klein SVG-pictogram van de glasvorm, gevuld met de kleur van de cocktail.

      <line x1="20" y1="23" x2="20" y2="31" stroke="${ink}" stroke-width="1.6"/>
      <line x1="13" y1="31" x2="27" y2="31" stroke="${ink}" stroke-width="1.6" stroke-linecap="round"/>
    `,
    coupe: `
      <path d="M7,10 C7,20 12,24 20,24 C28,24 33,20 33,10" fill="none" stroke="${ink}" stroke-width="1.6"/>
      <path d="M9,11.5 C9,19 13,22 20,22 C27,22 31,19 31,11.5 Z" ${fillAttrs}/>
      <line x1="20" y1="24" x2="20" y2="31" stroke="${ink}" stroke-width="1.6"/>
      <line x1="13" y1="31" x2="27" y2="31" stroke="${ink}" stroke-width="1.6" stroke-linecap="round"/>

      <path d="M14.6,11.5 L25.4,11.5 L24.7,33.3 L15.3,33.3 Z" ${fillAttrs}/>
    `,
    wine: `
      <path d="M10,6 C10,17 12,22 20,22 C28,22 30,17 30,6" fill="none" stroke="${ink}" stroke-width="1.6"/>
      <path d="M13,15 C13,19.5 15,20.5 20,20.5 C25,20.5 27,19.5 27,15 Z" ${fillAttrs}/>
      <line x1="20" y1="22" x2="20" y2="31" stroke="${ink}" stroke-width="1.6"/>
      <line x1="14" y1="31" x2="26" y2="31" stroke="${ink}" stroke-width="1.6" stroke-linecap="round"/>
    `,
    mug: `
      <path d="M12,10 L28,10 L28,30 L12,30 Z" fill="none" stroke="${ink}" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M13.3,14 L26.7,14 L26.7,29.3 L13.3,29.3 Z" ${fillAttrs}/>

    `,
    margarita: `
      <path d="M5,9 L35,9 L21,26 L19,26 Z" fill="none" stroke="${ink}" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M7.5,10.7 L32.5,10.7 L20.6,24.3 L19.4,24.3 Z" ${fillAttrs}/>
      <line x1="20" y1="26" x2="20" y2="31" stroke="${ink}" stroke-width="1.6"/>
      <line x1="13" y1="31" x2="27" y2="31" stroke="${ink}" stroke-width="1.6" stroke-linecap="round"/>

  };
  return `<svg viewBox="0 0 40 40" width="36" height="36" aria-hidden="true">${shapes[shape] || shapes.rocks}</svg>`;
}

function uid(){ return 'c'+Date.now()+Math.random().toString(16).slice(2,7); }

function loadData(){
  const statusEl = document.getElementById('status');
  cocktails = SEED.map(c=>({id:uid(), ...c}));
  cocktails.forEach(c=>{ c.categories = deriveCategories(c); c.glass = deriveGlass(c.meta); });
  statusEl.textContent = cocktails.length + ' cocktails in je thuisbar';
  renderFilters();
  renderFlavorFilters();
  render();
}

function renderFilters(){
  const el = document.getElementById('filters');
  el.innerHTML = '';
  CATS.forEach(cat=>{
    const b = document.createElement('button');
    b.className = 'chip' + (cat==='Alle' ? (activeFilters.size===0 ? ' active':'') : (activeFilters.has(cat) ? ' active':''));
    b.textContent = cat;
    b.onclick = ()=>{
      if(cat==='Alle'){
        activeFilters.clear();
      }else if(activeFilters.has(cat)){
        activeFilters.delete(cat);
      }else{
        activeFilters.add(cat);
      }
      renderFilters(); render();
    };
    el.appendChild(b);
  });
}

function renderFlavorFilters(){
  const el = document.getElementById('flavorFilters');
  el.innerHTML = '';
  FLAVORS.forEach(fl=>{
    const b = document.createElement('button');
    b.className = 'chip' + (fl==='Alle' ? (activeFlavors.size===0 ? ' active':'') : (activeFlavors.has(fl) ? ' active':''));
    b.textContent = fl;
    b.onclick = ()=>{
      if(fl==='Alle'){
        activeFlavors.clear();
      }else if(activeFlavors.has(fl)){
        activeFlavors.delete(fl);
      }else{
        activeFlavors.add(fl);
      }
      renderFlavorFilters(); render();
    };
    el.appendChild(b);
  });
}

function render(){
  const grid = document.getElementById('grid');
  const q = document.getElementById('search').value.trim().toLowerCase();
  let list = cocktails.filter(c=>{
    const matchCat = activeFilters.size===0 || Array.from(activeFilters).every(cat=>(c.categories||[c.category]).includes(cat));
    const matchFlavor = activeFlavors.size===0 || Array.from(activeFlavors).every(fl=>(c.flavors||[]).includes(fl));
    const matchQ = !q || c.name.toLowerCase().includes(q) ||
      (c.specs||[]).some(s=>s.i.toLowerCase().includes(q));
    return matchCat && matchFlavor && matchQ;
  });
  grid.innerHTML = '';
  if(list.length===0){
    grid.innerHTML = '<div class="empty">Geen cocktails gevonden.</div>';
    return;
  }
  list.forEach(c=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      ${c.image ? `<img class="card-img" src="${escapeAttr(c.image)}" onerror="this.style.display='none'">` : ''}
      <div class="card-body">
        <div class="card-head">
          <div class="card-head-text">
            <span class="card-tag">${escapeHtml((c.categories||[c.category]).join(' · '))}</span>
            <h3>${escapeHtml(c.name)}</h3>
          </div>
          <div class="glass-icon">${glassIconSVG(c.glass, c.color||'#cccccc')}</div>
        </div>
        ${c.desc ? `<div class="card-desc">${escapeHtml(c.desc)}</div>` : ''}
        ${c.favorite ? `<div class="favorite-badge"><span class="star">★</span>${escapeHtml(c.favorite)}</div>` : ''}
        ${(c.flavors&&c.flavors.length) ? `<div class="flavor-tags">${c.flavors.map(f=>`<span class="flavor-badge">${escapeHtml(f)}</span>`).join('')}</div>` : ''}
        <div class="specs">
          ${(c.specs||[]).map(s=>`<div><span class="ing">${escapeHtml(s.i)}</span><span class="amt">${escapeHtml(s.a)}</span></div>`).join('')}
        </div>
        ${c.meta ? `<div class="meta-line">${escapeHtml(c.meta)}</div>` : ''}
      </div>
    `;
    grid.appendChild(card);
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s); }

document.getElementById('search').addEventListener('input', render);

/* ================= Drawer / navigation ================= */
const menuToggle = document.getElementById('menuToggle');
const drawer = document.getElementById('drawer');
const drawerOverlay = document.getElementById('drawerOverlay');

function openDrawer(){
  drawer.classList.add('open');
  drawerOverlay.classList.add('open');
  menuToggle.classList.add('open');
}
function closeDrawer(){
  drawer.classList.remove('open');
  drawerOverlay.classList.remove('open');
  menuToggle.classList.remove('open');
}
menuToggle.addEventListener('click', ()=>{
  drawer.classList.contains('open') ? closeDrawer() : openDrawer();
});
drawerOverlay.addEventListener('click', closeDrawer);

document.querySelectorAll('.drawer-link').forEach(link=>{
  link.addEventListener('click', ()=>{
    const view = link.dataset.view;
    document.querySelectorAll('.drawer-link').forEach(l=>l.classList.toggle('active', l===link));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+view).classList.add('active');
    closeDrawer();
    window.scrollTo({top:0, behavior:'instant'});
  });
});

function renderDrankkast(){
  const el = document.getElementById('drankkastGrid');
  el.innerHTML = '';

    card.className = 'drankkast-card';

      <h3>${escapeHtml(cat)}</h3>
      ${brands.length
        ? `<ul class="brand-list">${brands.map(b=>`<li><span>${escapeHtml(b)}</span></li>`).join('')}</ul>`
        : `<div class="brand-empty">Nog geen merken toegevoegd.</div>`

    el.appendChild(card);

}
