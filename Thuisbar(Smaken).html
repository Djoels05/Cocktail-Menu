<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thuisbar — Receptkaart</title>
<style>
  :root{
    --green-deep:#16241F;
    --green-mid:#1F332C;
    --parchment:#EFE7D2;
    --brass:#B8934A;
    --brass-bright:#D4AF6A;
    --burgundy:#7A2E2E;
    --ink:#1A1410;
    --line: rgba(184,147,74,0.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--green-deep);
    background-image:
      radial-gradient(circle at 20% 0%, rgba(184,147,74,0.08), transparent 40%),
      radial-gradient(circle at 80% 100%, rgba(122,46,46,0.10), transparent 45%);
    color:var(--parchment);
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  .wrap{max-width:1000px; margin:0 auto;}

  header{
    text-align:center;
    margin-bottom:36px;
    border-bottom:1px solid var(--line);
    padding-bottom:24px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(2.2rem, 5vw, 3.4rem);
    letter-spacing:0.5px;
    margin:0 0 6px;
    color:var(--parchment);
  }
  header .sub{
    font-size:0.85rem;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--brass-bright);
  }

  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
  }
  .search-box{
    flex:1;
    min-width:220px;
    position:relative;
  }
  .search-box input{
    width:100%;
    padding:12px 14px 12px 38px;
    background:var(--green-mid);
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--parchment);
    font-family:inherit;
    font-size:0.95rem;
  }
  .search-box input:focus{
    outline:none;
    border-color:var(--brass-bright);
  }
  .search-box::before{
    content:"⌕";
    position:absolute;
    left:13px; top:50%; transform:translateY(-50%);
    color:var(--brass);
    font-size:1.1rem;
  }
  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:28px;
  }
  .chip{
    padding:6px 14px;
    border:1px solid var(--line);
    border-radius:20px;
    font-size:0.78rem;
    letter-spacing:0.5px;
    text-transform:uppercase;
    cursor:pointer;
    color:var(--parchment);
    background:transparent;
    font-family:inherit;
    transition:all 0.15s;
  }
  .chip.active{
    background:var(--brass);
    border-color:var(--brass);
    color:var(--green-deep);
    font-weight:600;
  }
  .chip:hover:not(.active){border-color:var(--brass-bright);}

  .filters-flavor{margin-top:-18px;}
  .filters-flavor .chip.active{
    background:var(--burgundy);
    border-color:var(--burgundy);
    color:var(--parchment);
  }
  .filters-flavor .chip:hover:not(.active){border-color:var(--burgundy);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(270px, 1fr));
    gap:18px;
  }

  .card{
    background:var(--parchment);
    color:var(--ink);
    border-radius:2px;
    position:relative;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
    display:flex;
    flex-direction:column;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0; height:4px;
    background:repeating-linear-gradient(90deg, var(--brass) 0 8px, transparent 8px 14px);
  }
  .card-img{
    width:100%;
    height:150px;
    object-fit:cover;
    display:block;
    filter:sepia(0.15);
    border-bottom:1px dashed rgba(26,20,16,0.25);
  }
  .card-body{
    padding:16px 18px 14px;
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .card-tag{
    display:inline-block;
    font-size:0.65rem;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--burgundy);
    font-weight:600;
    margin-bottom:6px;
  }
  .card-body h3{
    font-family:'Fraunces', serif;
    font-size:1.3rem;
    margin:0 0 6px;
    font-weight:700;
  }
  .card-desc{
    font-size:0.82rem;
    line-height:1.45;
    color:#4a3f30;
    margin-bottom:12px;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .specs{
    border-top:1px dashed rgba(26,20,16,0.25);
    padding-top:10px;
    margin-top:auto;
    font-size:0.78rem;
    line-height:1.7;
  }
  .specs div{display:flex; justify-content:space-between; gap:8px;}
  .specs .ing{color:var(--ink);}
  .specs .amt{color:var(--burgundy); font-weight:600; white-space:nowrap;}
  .meta-line{
    font-size:0.72rem;
    color:#6b5c46;
    margin-top:10px;
    font-style:italic;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }

  .flavor-tags{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-bottom:12px;
  }
  .flavor-badge{
    font-size:0.66rem;
    letter-spacing:0.5px;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:20px;
    background:rgba(122,46,46,0.08);
    border:1px solid rgba(122,46,46,0.25);
    color:var(--burgundy);
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-weight:600;
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--brass-bright);
    font-style:italic;
    grid-column:1/-1;
  }

  .status{
    text-align:center;
    font-size:0.75rem;
    color:var(--brass);
    margin-top:30px;
    opacity:0.7;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>De Thuisbar</h1>
    <div class="sub">Wat ik voor je kan maken</div>
  </header>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="search" placeholder="Zoek op naam of ingrediënt…">
    </div>
  </div>

  <div class="filters" id="filters"></div>
  <div class="filters filters-flavor" id="flavorFilters"></div>

  <div class="grid" id="grid"></div>

  <div class="status" id="status">geladen…</div>
</div>

<script>
let cocktails = [];
let activeFilters = new Set();
let activeFlavors = new Set();
const FLAVORS = ["Alle","zoet","zuur","bitter","fruitig","sterk","fris","romig"];

const SEED = [
  {name:"Gin Tonic", category:"Gin", desc:"Fris, kruidig en verfrissend — de klassieker die nooit teleurstelt.",
    specs:[{i:"Gin",a:"50 ml"},{i:"Tonic",a:"150 ml"},{i:"Limoen",a:"1 partje"}], meta:"Longdrinkglas, ijs", image:"", flavors:["bitter","fris","zuur"]},
  {name:"Negroni", category:"Gin", desc:"Bitter, sterk en Italiaans — gelijke delen, geen compromis.",
    specs:[{i:"Gin",a:"30 ml"},{i:"Campari",a:"30 ml"},{i:"Rode vermouth",a:"30 ml"}], meta:"Tumbler, sinaasappelschil", image:"", flavors:["bitter","sterk"]},
  {name:"Martini", category:"Gin", desc:"Strak, ijskoud en droog. Roeren, niet schudden.",
    specs:[{i:"Gin",a:"60 ml"},{i:"Droge vermouth",a:"10 ml"}], meta:"Martiniglas, olijf of citroenzeste", image:"", flavors:["sterk"]},
  {name:"Mojito", category:"Rum", desc:"Munt, limoen en rum — Cubaanse zomer in een glas.",
    specs:[{i:"Witte rum",a:"50 ml"},{i:"Limoensap",a:"25 ml"},{i:"Suikersiroop",a:"20 ml"},{i:"Munt",a:"8 blaadjes"},{i:"Soda",a:"aanvullen"}], meta:"Longdrinkglas, muntbosje", image:"", flavors:["fris","zuur","zoet"]},
  {name:"Daiquiri", category:"Rum", desc:"Simpel en perfect: rum, limoen, suiker. Meer heeft het niet nodig.",
    specs:[{i:"Witte rum",a:"60 ml"},{i:"Limoensap",a:"25 ml"},{i:"Suikersiroop",a:"20 ml"}], meta:"Coupeglas", image:"", flavors:["zuur","zoet","fris"]},
  {name:"Old Fashioned", category:"Whiskey", desc:"Puur, stroperig en tijdloos — whiskey zoals het hoort.",
    specs:[{i:"Bourbon/rye",a:"60 ml"},{i:"Suikerklontje",a:"1"},{i:"Angostura bitter",a:"2 dashes"},{i:"Water",a:"scheutje"}], meta:"Tumbler, sinaasappelschil", image:"", flavors:["sterk","zoet","bitter"]},
  {name:"Whiskey Sour", category:"Whiskey", desc:"Zuur, zoet en romig — met of zonder eiwit.",
    specs:[{i:"Bourbon",a:"50 ml"},{i:"Citroensap",a:"25 ml"},{i:"Suikersiroop",a:"20 ml"},{i:"Eiwit",a:"1 (optioneel)"}], meta:"Tumbler", image:"", flavors:["zuur","zoet","romig"]},
  {name:"New York Sour", category:"Whiskey", desc:"Whiskey Sour met rode wijn",
    specs:[{i:"Bourbon",a:"50 ml"},{i:"Citroensap",a:"25 ml"},{i:"Suikersiroop",a:"20 ml"},{i:"Eiwit",a:"1 (optioneel)"}, {i:"Rode wijn",a:"22.5 ml"}], meta:"Tumbler", image:"", flavors:["zuur","zoet","sterk"]},
  {name:"Manhattan", category:"Whiskey", desc:"Zacht, kruidig en volwassen. New Yorks antwoord op de Martini.",
    specs:[{i:"Rye whiskey",a:"60 ml"},{i:"Rode vermouth",a:"30 ml"},{i:"Angostura bitter",a:"2 dashes"}], meta:"Coupeglas, cocktailkers", image:"", flavors:["sterk","bitter","zoet"]},
  {name:"Margarita", category:"Tequila", desc:"Zilt, zuur en zonnig — de tequila-klassieker bij uitstek.",
    specs:[{i:"Tequila",a:"50 ml"},{i:"Triple sec",a:"20 ml"},{i:"Limoensap",a:"25 ml"}], meta:"Glas met zoutrand", image:"", flavors:["zuur","fris"]},
  {name:"Moscow Mule", category:"Wodka", desc:"Pittige gember en frisse limoen, traditioneel in koper geserveerd.",
    specs:[{i:"Wodka",a:"50 ml"},{i:"Gemberbier",a:"120 ml"},{i:"Limoensap",a:"15 ml"}], meta:"Koperen beker, muntblaadje", image:"", flavors:["fris","zuur"]},
  {name:"Cosmopolitan", category:"Wodka", desc:"Roze, elegant en fruitig zuur.",
    specs:[{i:"Wodka",a:"40 ml"},{i:"Triple sec",a:"15 ml"},{i:"Cranberrysap",a:"30 ml"},{i:"Limoensap",a:"15 ml"}], meta:"Coupeglas, sinaasappelzeste", image:"", flavors:["fruitig","zuur","zoet"]},
  {name:"Espresso Martini", category:"Wodka", desc:"Zoet, sterk en klaarwakker — dessert en borrel ineen.",
    specs:[{i:"Wodka",a:"30 ml"},{i:"Koffielikeur",a:"30 ml"},{i:"Verse espresso",a:"30 ml"}], meta:"Coupeglas, 3 koffiebonen", image:"", flavors:["zoet","sterk","romig"]},
  {name:"Aperol Spritz", category:"Bubbels", desc:"Licht, bitterzoet en oneindig terrasvriendelijk.",
    specs:[{i:"Aperol",a:"60 ml"},{i:"Prosecco",a:"90 ml"},{i:"Soda",a:"scheutje"}], meta:"Wijnglas, sinaasappelschijf", image:"", flavors:["bitter","fris","fruitig"]},
  {name:"Dark 'n' Stormy", category:"Rum", desc:"Pittige gember met donkere rum — eenvoudig en krachtig.",
    specs:[{i:"Donkere rum",a:"50 ml"},{i:"Gemberbier",a:"120 ml"},{i:"Limoensap",a:"10 ml"}], meta:"Highballglas", image:"", flavors:["fris","sterk"]},
  {name:"Naked and Famous", category:"Overige", specs:[{i:"Tequila",a:"22.5 ml"},{i:"Aperol",a:"22.5 ml"},{i:"Limoensap",a:"22.5 ml"},{i:"Gele Chartreuse",a:"22.5 ml"}], meta:"Martini glass", image:"", flavors:["bitter","zuur","sterk"]},
  {name:"The Last Word", category:"Gin", specs:[{i:"London Dry Gin",a:"22.5 ml"},{i:"Groene Chartreuse",a:"22.5 ml"},{i:"Limoensap",a:"22.5 ml"},{i:"Maraschino Likeur",a:"22.5 ml"}], meta:"Martini glass", image:"", flavors:["zuur","sterk","zoet"]},
  {name:"Mai Tai", category:"Rum", specs:[{i:"Donkere Rum",a:"60 ml"},{i:"Curaçao",a:"15 ml"},{i:"Orgeat",a:"15 ml"},{i:"Limoensap",a:"30 ml"},{i:"Suikersiroop",a:"7.5 ml"}], meta:"Rocks glass met munt", image:"", flavors:["zoet","fruitig","sterk"]},
  {name:"East Village Athletic Club", category:"Tequila", specs:[{i:"Tequila Blanco",a:"22.5 ml"},{i:"Gele Chartreuse",a:"22.5 ml"},{i:"Citroensap",a:"22.5 ml"},{i:"Grand marnier",a:"22.5 ml"}], meta:"Martini glass", image:"", flavors:["zuur","sterk","fruitig"]},
  {name:"Sidecar", category:"Overige", specs:[{i:"Cognac",a:"50 ml"},{i:"Triple Sec",a:"20 ml"},{i:"Citroensap",a:"20ml"}], meta:"Coupe glass", image:"", flavors:["zuur","zoet","sterk"]},
  {name:"Love & Murder", category:"Overige", specs:[{i:"Campari",a:"22.5 ml"},{i:"Groene Chartreuse",a:"22.5 ml"},{i:"Limoensap",a:"22.5 ml"},{i:"Suikersiroop",a:"22.5 ml"}], meta:"Martini glass", image:"", flavors:["bitter","zuur","zoet"]},
];

const CATS = ["Alle","Brandy","Amari","Vermouth","Gin","Rum","Whiskey","Tequila","Wodka","Bubbels","Overige","Mocktail"];

// Herkent welke spirit-categorieën in een cocktail zitten op basis van de ingrediëntnamen.
const SPIRIT_KEYWORDS = {
  Brandy: ["cognac", "brandy"],
  Amari: ["campari", "aperol"],
  Vermouth: ["vermouth"],
  Gin: ["gin"],
  Rum: ["rum"],
  Whiskey: ["whisk", "bourbon", "rye"],
  Tequila: ["tequila"],
  Wodka: ["wodka", "vodka"],
  Bubbels: ["prosecco", "champagne", "cava"],
  Overige: ["chartreuse", "maraschino", "curaçao", "curacao", "triple sec", "grand marnier", "cointreau", "koffielikeur", "kahlua", "kahlúa", "amaretto", "sambuca", "baileys"]
};

function deriveCategories(c){
  const cats = new Set();
  if(c.category) cats.add(c.category);
  (c.specs||[]).forEach(s=>{
    const ing = (s.i||'').toLowerCase();
    Object.entries(SPIRIT_KEYWORDS).forEach(([cat, keywords])=>{
      if(keywords.some(k=>ing.includes(k))) cats.add(cat);
    });
  });
  return Array.from(cats);
}

function uid(){ return 'c'+Date.now()+Math.random().toString(16).slice(2,7); }

function loadData(){
  const statusEl = document.getElementById('status');
  cocktails = SEED.map(c=>({id:uid(), ...c}));
  cocktails.forEach(c=>{ c.categories = deriveCategories(c); });
  statusEl.textContent = cocktails.length + ' cocktails in je thuisbar';
  renderFilters();
  renderFlavorFilters();
  render();
}

function renderFilters(){
  const el = document.getElementById('filters');
  el.innerHTML = '';
  CATS.forEach(cat=>{
    const b = document.createElement('button');
    b.className = 'chip' + (cat==='Alle' ? (activeFilters.size===0 ? ' active':'') : (activeFilters.has(cat) ? ' active':''));
    b.textContent = cat;
    b.onclick = ()=>{
      if(cat==='Alle'){
        activeFilters.clear();
      }else if(activeFilters.has(cat)){
        activeFilters.delete(cat);
      }else{
        activeFilters.add(cat);
      }
      renderFilters(); render();
    };
    el.appendChild(b);
  });
}

function renderFlavorFilters(){
  const el = document.getElementById('flavorFilters');
  el.innerHTML = '';
  FLAVORS.forEach(fl=>{
    const b = document.createElement('button');
    b.className = 'chip' + (fl==='Alle' ? (activeFlavors.size===0 ? ' active':'') : (activeFlavors.has(fl) ? ' active':''));
    b.textContent = fl;
    b.onclick = ()=>{
      if(fl==='Alle'){
        activeFlavors.clear();
      }else if(activeFlavors.has(fl)){
        activeFlavors.delete(fl);
      }else{
        activeFlavors.add(fl);
      }
      renderFlavorFilters(); render();
    };
    el.appendChild(b);
  });
}

function render(){
  const grid = document.getElementById('grid');
  const q = document.getElementById('search').value.trim().toLowerCase();
  let list = cocktails.filter(c=>{
    const matchCat = activeFilters.size===0 || Array.from(activeFilters).every(cat=>(c.categories||[c.category]).includes(cat));
    const matchFlavor = activeFlavors.size===0 || Array.from(activeFlavors).every(fl=>(c.flavors||[]).includes(fl));
    const matchQ = !q || c.name.toLowerCase().includes(q) ||
      (c.specs||[]).some(s=>s.i.toLowerCase().includes(q));
    return matchCat && matchFlavor && matchQ;
  });
  grid.innerHTML = '';
  if(list.length===0){
    grid.innerHTML = '<div class="empty">Geen cocktails gevonden.</div>';
    return;
  }
  list.forEach(c=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      ${c.image ? `<img class="card-img" src="${escapeAttr(c.image)}" onerror="this.style.display='none'">` : ''}
      <div class="card-body">
        <span class="card-tag">${escapeHtml((c.categories||[c.category]).join(' · '))}</span>
        <h3>${escapeHtml(c.name)}</h3>
        <div class="card-desc">${escapeHtml(c.desc||'')}</div>
        ${(c.flavors&&c.flavors.length) ? `<div class="flavor-tags">${c.flavors.map(f=>`<span class="flavor-badge">${escapeHtml(f)}</span>`).join('')}</div>` : ''}
        <div class="specs">
          ${(c.specs||[]).map(s=>`<div><span class="ing">${escapeHtml(s.i)}</span><span class="amt">${escapeHtml(s.a)}</span></div>`).join('')}
        </div>
        ${c.meta ? `<div class="meta-line">${escapeHtml(c.meta)}</div>` : ''}
      </div>
    `;
    grid.appendChild(card);
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s); }

document.getElementById('search').addEventListener('input', render);

loadData();
</script>
</body>
</html>
