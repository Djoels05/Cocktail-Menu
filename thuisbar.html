<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thuisbar — Receptkaart</title>
<style>
  :root{
    --green-deep:#16241F;
    --green-mid:#1F332C;
    --parchment:#EFE7D2;
    --brass:#B8934A;
    --brass-bright:#D4AF6A;
    --burgundy:#7A2E2E;
    --ink:#1A1410;
    --line: rgba(184,147,74,0.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--green-deep);
    background-image:
      radial-gradient(circle at 20% 0%, rgba(184,147,74,0.08), transparent 40%),
      radial-gradient(circle at 80% 100%, rgba(122,46,46,0.10), transparent 45%);
    color:var(--parchment);
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  .wrap{max-width:1000px; margin:0 auto;}

  header{
    text-align:center;
    margin-bottom:36px;
    border-bottom:1px solid var(--line);
    padding-bottom:24px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(2.2rem, 5vw, 3.4rem);
    letter-spacing:0.5px;
    margin:0 0 6px;
    color:var(--parchment);
  }
  header .sub{
    font-size:0.85rem;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--brass-bright);
  }

  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
  }
  .search-box{
    flex:1;
    min-width:220px;
    position:relative;
  }
  .search-box input{
    width:100%;
    padding:12px 14px 12px 38px;
    background:var(--green-mid);
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--parchment);
    font-family:inherit;
    font-size:0.95rem;
  }
  .search-box input:focus{
    outline:none;
    border-color:var(--brass-bright);
  }
  .search-box::before{
    content:"⌕";
    position:absolute;
    left:13px; top:50%; transform:translateY(-50%);
    color:var(--brass);
    font-size:1.1rem;
  }
  .add-btn{
    background:var(--burgundy);
    color:var(--parchment);
    border:1px solid rgba(212,175,106,0.4);
    padding:12px 18px;
    border-radius:3px;
    font-family:inherit;
    font-weight:600;
    font-size:0.9rem;
    cursor:pointer;
    white-space:nowrap;
    transition:background 0.15s;
  }
  .add-btn:hover{background:#8f3838;}

  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:28px;
  }
  .chip{
    padding:6px 14px;
    border:1px solid var(--line);
    border-radius:20px;
    font-size:0.78rem;
    letter-spacing:0.5px;
    text-transform:uppercase;
    cursor:pointer;
    color:var(--parchment);
    background:transparent;
    font-family:inherit;
    transition:all 0.15s;
  }
  .chip.active{
    background:var(--brass);
    border-color:var(--brass);
    color:var(--green-deep);
    font-weight:600;
  }
  .chip:hover:not(.active){border-color:var(--brass-bright);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(270px, 1fr));
    gap:18px;
  }

  .card{
    background:var(--parchment);
    color:var(--ink);
    border-radius:2px;
    position:relative;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
    display:flex;
    flex-direction:column;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0; height:4px;
    background:repeating-linear-gradient(90deg, var(--brass) 0 8px, transparent 8px 14px);
  }
  .card-img{
    width:100%;
    height:150px;
    object-fit:cover;
    display:block;
    filter:sepia(0.15);
    border-bottom:1px dashed rgba(26,20,16,0.25);
  }
  .card-body{
    padding:16px 18px 14px;
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .card-tag{
    display:inline-block;
    font-size:0.65rem;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--burgundy);
    font-weight:600;
    margin-bottom:6px;
  }
  .card-body h3{
    font-family:'Fraunces', serif;
    font-size:1.3rem;
    margin:0 0 6px;
    font-weight:700;
  }
  .card-desc{
    font-size:0.82rem;
    line-height:1.45;
    color:#4a3f30;
    margin-bottom:12px;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .specs{
    border-top:1px dashed rgba(26,20,16,0.25);
    padding-top:10px;
    margin-top:auto;
    font-size:0.78rem;
    line-height:1.7;
  }
  .specs div{display:flex; justify-content:space-between; gap:8px;}
  .specs .ing{color:var(--ink);}
  .specs .amt{color:var(--burgundy); font-weight:600; white-space:nowrap;}
  .meta-line{
    font-size:0.72rem;
    color:#6b5c46;
    margin-top:10px;
    font-style:italic;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }

  .card-actions{
    display:flex;
    border-top:1px solid rgba(26,20,16,0.15);
  }
  .card-actions button{
    flex:1;
    background:transparent;
    border:none;
    padding:10px;
    font-family:inherit;
    font-size:0.75rem;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
    color:#5a4d3a;
  }
  .card-actions button:first-child{border-right:1px solid rgba(26,20,16,0.15);}
  .card-actions button:hover{background:rgba(184,147,74,0.15);}
  .card-actions button.del:hover{background:rgba(122,46,46,0.15); color:var(--burgundy);}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--brass-bright);
    font-style:italic;
    grid-column:1/-1;
  }

  /* Modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(10,15,12,0.75);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--parchment);
    color:var(--ink);
    width:100%;
    max-width:520px;
    max-height:88vh;
    overflow-y:auto;
    border-radius:3px;
    padding:26px 26px 22px;
  }
  .modal h2{
    font-family:'Fraunces', serif;
    margin:0 0 18px;
    font-size:1.5rem;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:0.72rem;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--burgundy);
    margin-bottom:5px;
    font-weight:600;
  }
  .field input, .field textarea, .field select{
    width:100%;
    padding:9px 10px;
    border:1px solid rgba(26,20,16,0.3);
    border-radius:2px;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:0.88rem;
    background:#fff;
    color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:60px;}
  .spec-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
  }
  .spec-row input{flex:1;}
  .spec-row button{
    background:var(--burgundy);
    color:#fff;
    border:none;
    width:34px;
    border-radius:2px;
    cursor:pointer;
    font-size:1rem;
  }
  .add-spec{
    background:transparent;
    border:1px dashed var(--brass);
    color:var(--burgundy);
    padding:7px 12px;
    border-radius:2px;
    font-family:inherit;
    font-size:0.78rem;
    cursor:pointer;
    margin-bottom:16px;
  }
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:8px;
  }
  .modal-actions button{
    flex:1;
    padding:11px;
    border:none;
    border-radius:2px;
    font-family:inherit;
    font-weight:600;
    font-size:0.85rem;
    cursor:pointer;
  }
  .btn-save{background:var(--burgundy); color:#fff;}
  .btn-cancel{background:transparent; border:1px solid rgba(26,20,16,0.3) !important; color:var(--ink);}

  .status{
    text-align:center;
    font-size:0.75rem;
    color:var(--brass);
    margin-top:30px;
    opacity:0.7;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>De Thuisbar</h1>
    <div class="sub">Wat ik voor je kan maken</div>
  </header>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="search" placeholder="Zoek op naam of ingrediënt…">
    </div>
    <button class="add-btn" onclick="openModal()">+ Nieuwe cocktail</button>
  </div>

  <div class="filters" id="filters"></div>

  <div class="grid" id="grid"></div>

  <div class="status" id="status">geladen…</div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Nieuwe cocktail</h2>
    <input type="hidden" id="editId">
    <div class="field">
      <label>Naam</label>
      <input type="text" id="f-name" placeholder="bv. Negroni">
    </div>
    <div class="field">
      <label>Categorie (basis)</label>
      <select id="f-category">
        <option>Gin</option>
        <option>Rum</option>
        <option>Whiskey</option>
        <option>Tequila</option>
        <option>Wodka</option>
        <option>Bubbels</option>
        <option>Overige</option>
        <option>Mocktail</option>
      </select>
    </div>
    <div class="field">
      <label>Beschrijving</label>
      <textarea id="f-desc" placeholder="Korte omschrijving van smaak/sfeer"></textarea>
    </div>
    <div class="field">
      <label>Specs (ingrediënt + hoeveelheid)</label>
      <div id="specRows"></div>
      <button type="button" class="add-spec" onclick="addSpecRow()">+ ingrediënt toevoegen</button>
    </div>
    <div class="field">
      <label>Glas / garnering (optioneel)</label>
      <input type="text" id="f-meta" placeholder="bv. Tumbler, sinaasappelschil">
    </div>
    <div class="field">
      <label>Foto-URL (optioneel)</label>
      <input type="text" id="f-image" placeholder="https://...">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Annuleer</button>
      <button class="btn-save" onclick="saveCocktail()">Opslaan</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'thuisbar-cocktails';
let cocktails = [];
let activeFilter = 'Alle';

const SEED = [
  {name:"Gin Tonic", category:"Gin", desc:"Fris, kruidig en verfrissend — de klassieker die nooit teleurstelt.",
    specs:[{i:"Gin",a:"5 cl"},{i:"Tonic",a:"15 cl"},{i:"Limoen",a:"1 partje"}], meta:"Longdrinkglas, ijs", image:""},
  {name:"Negroni", category:"Gin", desc:"Bitter, sterk en Italiaans — gelijke delen, geen compromis.",
    specs:[{i:"Gin",a:"3 cl"},{i:"Campari",a:"3 cl"},{i:"Rode vermouth",a:"3 cl"}], meta:"Tumbler, sinaasappelschil", image:""},
  {name:"Martini", category:"Gin", desc:"Strak, ijskoud en droog. Roeren, niet schudden.",
    specs:[{i:"Gin",a:"6 cl"},{i:"Droge vermouth",a:"1 cl"}], meta:"Martiniglas, olijf of citroenzeste", image:""},
  {name:"Mojito", category:"Rum", desc:"Munt, limoen en rum — Cubaanse zomer in een glas.",
    specs:[{i:"Witte rum",a:"5 cl"},{i:"Limoensap",a:"2,5 cl"},{i:"Suikersiroop",a:"2 cl"},{i:"Munt",a:"8 blaadjes"},{i:"Soda",a:"aanvullen"}], meta:"Longdrinkglas, muntbosje", image:""},
  {name:"Daiquiri", category:"Rum", desc:"Simpel en perfect: rum, limoen, suiker. Meer heeft het niet nodig.",
    specs:[{i:"Witte rum",a:"6 cl"},{i:"Limoensap",a:"2,5 cl"},{i:"Suikersiroop",a:"2 cl"}], meta:"Coupeglas", image:""},
  {name:"Old Fashioned", category:"Whiskey", desc:"Puur, stroperig en tijdloos — whiskey zoals het hoort.",
    specs:[{i:"Bourbon/rye",a:"6 cl"},{i:"Suikerklontje",a:"1"},{i:"Angostura bitter",a:"2 dashes"},{i:"Water",a:"scheutje"}], meta:"Tumbler, sinaasappelschil", image:""},
  {name:"Whiskey Sour", category:"Whiskey", desc:"Zuur, zoet en romig — met of zonder eiwit.",
    specs:[{i:"Bourbon",a:"5 cl"},{i:"Citroensap",a:"2,5 cl"},{i:"Suikersiroop",a:"2 cl"},{i:"Eiwit",a:"1 (optioneel)"}], meta:"Tumbler", image:""},
  {name:"New York Sour", category:"Whiskey", desc:"Whiskey Sour met rode wijn",
    specs:[{i:"Bourbon",a:"50 ùl"},{i:"Citroensap",a:"25 ml"},{i:"Suikersiroop",a:"20 ml"},{i:"Eiwit",a:"1 (optioneel)"}, {i:"Rode wijn",a:"22.5 ml"}], meta:"Tumbler", image:""},
  {name:"Manhattan", category:"Whiskey", desc:"Zacht, kruidig en volwassen. New Yorks antwoord op de Martini.",
    specs:[{i:"Rye whiskey",a:"6 cl"},{i:"Rode vermouth",a:"3 cl"},{i:"Angostura bitter",a:"2 dashes"}], meta:"Coupeglas, cocktailkers", image:""},
  {name:"Margarita", category:"Tequila", desc:"Zilt, zuur en zonnig — de tequila-klassieker bij uitstek.",
    specs:[{i:"Tequila",a:"5 cl"},{i:"Triple sec",a:"2 cl"},{i:"Limoensap",a:"2,5 cl"}], meta:"Glas met zoutrand", image:""},
  {name:"Moscow Mule", category:"Wodka", desc:"Pittige gember en frisse limoen, traditioneel in koper geserveerd.",
    specs:[{i:"Wodka",a:"5 cl"},{i:"Gemberbier",a:"12 cl"},{i:"Limoensap",a:"1,5 cl"}], meta:"Koperen beker, muntblaadje", image:""},
  {name:"Cosmopolitan", category:"Wodka", desc:"Roze, elegant en fruitig zuur.",
    specs:[{i:"Wodka",a:"4 cl"},{i:"Triple sec",a:"1,5 cl"},{i:"Cranberrysap",a:"3 cl"},{i:"Limoensap",a:"1,5 cl"}], meta:"Coupeglas, sinaasappelzeste", image:""},
  {name:"Espresso Martini", category:"Wodka", desc:"Zoet, sterk en klaarwakker — dessert en borrel ineen.",
    specs:[{i:"Wodka",a:"30 ml"},{i:"Koffielikeur",a:"30 ml"},{i:"Verse espresso",a:"30 ml"}], meta:"Coupeglas, 3 koffiebonen", image:""},
  {name:"Aperol Spritz", category:"Bubbels", desc:"Licht, bitterzoet en oneindig terrasvriendelijk.",
    specs:[{i:"Aperol",a:"6 cl"},{i:"Prosecco",a:"9 cl"},{i:"Soda",a:"scheutje"}], meta:"Wijnglas, sinaasappelschijf", image:""},
  {name:"Dark 'n' Stormy", category:"Rum", desc:"Pittige gember met donkere rum — eenvoudig en krachtig.",
    specs:[{i:"Donkere rum",a:"5 cl"},{i:"Gemberbier",a:"12 cl"},{i:"Limoensap",a:"1 cl"}], meta:"Highballglas", image:""},
  {name:"Naked and Famous", category:"Overige", specs:[{i:"Tequila",a:"22.5 ml"},{i:"Aperol",a:"22.5 ml"},{i:"Limoensap",a:"22.5 ml"},{i:"Gele Chartreuse",a:"22.5 ml"}], meta:"Martini glass", image:""},
  {name:"The Last Word", category:"Gin", specs:[{i:"London Dry Gin",a:"22.5 ml"},{i:"Groene Chartreuse",a:"22.5 ml"},{i:"Limoensap",a:"22.5 ml"},{i:"Maraschino Likeur",a:"22.5 ml"}], meta:"Martini glass", image:""},
  {name:"Mai Tai", category:"Rum", specs:[{i:"Donkere Rum",a:"60 ml"},{i:"Curaçao",a:"15 ml"},{i:"Orgeat",a:"15 ml"},{i:"Limoensap",a:"30 ml"},{i:"Suikersiroop",a:"7.5 ml"}], meta:"Rocks glass met munt", image:""},
  {name:"East Village Athletic Club", category:"Tequila", specs:[{i:"Tequila Blanco",a:"22.5 ml"},{i:"Gele Chartreuse",a:"22.5 ml"},{i:"Citroensap",a:"22.5 ml"},{i:"Grand marnier",a:"22.5 ml"}], meta:"Martini glass", image:""},
  {name:"Sidecar", category:"Overige", specs:[{i:"Cognac",a:"50 ml"},{i:"Triple Sec",a:"20 ml"},{i:"Citroensap",a:"20ml"}], meta:"Coupe glass", image:""},
  {name:"Love & Murder", category:"Overige", specs:[{i:"Campari",a:"22.5 ml"},{i:"Groene Chartreuse",a:"22.5 ml"},{i:"Limoensap",a:"22.5 ml"},{i:"Suikersiroop",a:"22.5 ml"}], meta:"Martini glass", image:""},
];

const CATS = ["Alle","Gin","Rum","Whiskey","Tequila","Wodka","Bubbels","Overige","Mocktail"];

function uid(){ return 'c'+Date.now()+Math.random().toString(16).slice(2,7); }

// Gebruik Claude's opslag wanneer beschikbaar (binnen Claude.ai), anders val terug
// op de opslag van de eigen browser zodat het bestand ook los blijft werken.
const hasCloudStorage = (typeof window.storage !== 'undefined' && window.storage !== null);

async function storageGet(key){
  if(hasCloudStorage){
    try{
      const res = await window.storage.get(key, false);
      return res && res.value ? res.value : null;
    }catch(e){ return null; }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}

async function storageSet(key, value){
  if(hasCloudStorage){
    try{ await window.storage.set(key, value, false); return; }catch(e){ /* val terug op local */ }
  }
  try{ localStorage.setItem(key, value); }catch(e){ console.error('opslaan mislukt', e); }
}

async function loadData(){
  const statusEl = document.getElementById('status');
  const raw = await storageGet(STORAGE_KEY);
  cocktails = raw ? JSON.parse(raw) : null;
  if(!cocktails){
    cocktails = SEED.map(c=>({id:uid(), ...c}));
    await persist();
  }
  statusEl.textContent = cocktails.length + ' cocktails in je thuisbar' + (hasCloudStorage ? '' : ' (lokaal opgeslagen in deze browser)');
  renderFilters();
  render();
}

async function persist(){
  await storageSet(STORAGE_KEY, JSON.stringify(cocktails));
}

function renderFilters(){
  const el = document.getElementById('filters');
  el.innerHTML = '';
  CATS.forEach(cat=>{
    const b = document.createElement('button');
    b.className = 'chip' + (cat===activeFilter ? ' active':'');
    b.textContent = cat;
    b.onclick = ()=>{ activeFilter = cat; renderFilters(); render(); };
    el.appendChild(b);
  });
}

function render(){
  const grid = document.getElementById('grid');
  const q = document.getElementById('search').value.trim().toLowerCase();
  let list = cocktails.filter(c=>{
    const matchCat = activeFilter==='Alle' || c.category===activeFilter;
    const matchQ = !q || c.name.toLowerCase().includes(q) ||
      (c.specs||[]).some(s=>s.i.toLowerCase().includes(q));
    return matchCat && matchQ;
  });
  grid.innerHTML = '';
  if(list.length===0){
    grid.innerHTML = '<div class="empty">Geen cocktails gevonden.</div>';
    return;
  }
  list.forEach(c=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      ${c.image ? `<img class="card-img" src="${escapeAttr(c.image)}" onerror="this.style.display='none'">` : ''}
      <div class="card-body">
        <span class="card-tag">${escapeHtml(c.category)}</span>
        <h3>${escapeHtml(c.name)}</h3>
        <div class="card-desc">${escapeHtml(c.desc||'')}</div>
        <div class="specs">
          ${(c.specs||[]).map(s=>`<div><span class="ing">${escapeHtml(s.i)}</span><span class="amt">${escapeHtml(s.a)}</span></div>`).join('')}
        </div>
        ${c.meta ? `<div class="meta-line">${escapeHtml(c.meta)}</div>` : ''}
      </div>
      <div class="card-actions">
        <button onclick="openModal('${c.id}')">Bewerk</button>
        <button class="del" onclick="deleteCocktail('${c.id}')">Verwijder</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s); }

document.getElementById('search').addEventListener('input', render);

// Modal logic
function openModal(id){
  document.getElementById('overlay').classList.add('open');
  document.getElementById('specRows').innerHTML = '';
  if(id){
    const c = cocktails.find(x=>x.id===id);
    document.getElementById('modalTitle').textContent = 'Cocktail bewerken';
    document.getElementById('editId').value = id;
    document.getElementById('f-name').value = c.name;
    document.getElementById('f-category').value = c.category;
    document.getElementById('f-desc').value = c.desc||'';
    document.getElementById('f-meta').value = c.meta||'';
    document.getElementById('f-image').value = c.image||'';
    (c.specs||[]).forEach(s=>addSpecRow(s.i, s.a));
    if((c.specs||[]).length===0) addSpecRow();
  }else{
    document.getElementById('modalTitle').textContent = 'Nieuwe cocktail';
    document.getElementById('editId').value = '';
    document.getElementById('f-name').value = '';
    document.getElementById('f-category').value = 'Gin';
    document.getElementById('f-desc').value = '';
    document.getElementById('f-meta').value = '';
    document.getElementById('f-image').value = '';
    addSpecRow(); addSpecRow();
  }
}
function closeModal(){
  document.getElementById('overlay').classList.remove('open');
}
function addSpecRow(ing='', amt=''){
  const row = document.createElement('div');
  row.className = 'spec-row';
  row.innerHTML = `
    <input type="text" placeholder="Ingrediënt" value="${escapeAttr(ing)}" class="spec-i">
    <input type="text" placeholder="Hoeveelheid" value="${escapeAttr(amt)}" class="spec-a">
    <button type="button" onclick="this.parentElement.remove()">×</button>
  `;
  document.getElementById('specRows').appendChild(row);
}

async function saveCocktail(){
  const name = document.getElementById('f-name').value.trim();
  if(!name){ alert('Geef de cocktail een naam.'); return; }
  const specs = Array.from(document.querySelectorAll('.spec-row')).map(r=>({
    i: r.querySelector('.spec-i').value.trim(),
    a: r.querySelector('.spec-a').value.trim()
  })).filter(s=>s.i);

  const id = document.getElementById('editId').value;
  const data = {
    name,
    category: document.getElementById('f-category').value,
    desc: document.getElementById('f-desc').value.trim(),
    specs,
    meta: document.getElementById('f-meta').value.trim(),
    image: document.getElementById('f-image').value.trim()
  };

  if(id){
    const idx = cocktails.findIndex(c=>c.id===id);
    cocktails[idx] = {id, ...data};
  }else{
    cocktails.push({id: uid(), ...data});
  }
  await persist();
  document.getElementById('status').textContent = cocktails.length + ' cocktails in je thuisbar' + (hasCloudStorage ? '' : ' (lokaal opgeslagen in deze browser)');
  closeModal();
  render();
}

async function deleteCocktail(id){
  if(!confirm('Deze cocktail verwijderen?')) return;
  cocktails = cocktails.filter(c=>c.id!==id);
  await persist();
  document.getElementById('status').textContent = cocktails.length + ' cocktails in je thuisbar' + (hasCloudStorage ? '' : ' (lokaal opgeslagen in deze browser)');
  render();
}

loadData();
</script>
